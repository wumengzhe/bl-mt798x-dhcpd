name: 798x-UBOOT-WMZ

on:
  #自动编译：每周日早上4点
  #schedule:
    #- cron: 0 20 * * 0
  #手动编译
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_TARGET: MTK-798x
  WRT_REPO: https://github.com/wumengzhe/bl-mt798x-dhcpd.git
  WRT_BRANCH: master

permissions: write-all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0

  build:
    runs-on: ubuntu-latest
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        WRT_ATF: [atf-20260123]
        WRT_MTK: [uboot-mtk-20250711]

    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu libssl-dev qemu-user-static
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_AUTHOR=$(echo $WRT_REPO | cut -d '/' -f 4)" >> $GITHUB_ENV
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d")" >> $GITHUB_ENV
          echo "WRT_VER=$(echo ${{matrix.WRT_ATF}} | grep -oP 'atf-\d+')_$(echo ${{matrix.WRT_MTK}} | grep -oP 'mtk-\d+')" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

      - name: Update Build Script
        run: |
          # 修改 build.sh 中的 UBOOT_DIR 和 ATF_DIR
          sed -i "s/UBOOT_DIR=.*/UBOOT_DIR=${{matrix.WRT_MTK}}/" ./wrt/build.sh
          sed -i "s/ATF_DIR=.*/ATF_DIR=${{matrix.WRT_ATF}}/" ./wrt/build.sh
          
          # 验证修改
          echo "Updated build.sh:"
          grep -E "(UBOOT_DIR|ATF_DIR)" ./wrt/build.sh

      - name: Verify Directories Exist
        run: |
          cd ./wrt/
          
          UBOOT_DIR="${{matrix.WRT_MTK}}"
          ATF_DIR="${{matrix.WRT_ATF}}"
          
          echo "Checking directories..."
          echo "UBOOT_DIR: $UBOOT_DIR exists: $(test -d $UBOOT_DIR && echo 'YES' || echo 'NO')"
          echo "ATF_DIR: $ATF_DIR exists: $(test -d $ATF_DIR && echo 'YES' || echo 'NO')"
          
          if [ ! -d "$UBOOT_DIR" ]; then
            echo "ERROR: UBOOT directory does not exist!"
            ls -la
            exit 1
          fi
          
          if [ ! -d "$ATF_DIR" ]; then
            echo "ERROR: ATF directory does not exist!"
            ls -la
            exit 1
          fi
          
          echo "Contents of UBOOT_DIR configs:"
          ls -la $UBOOT_DIR/configs/ | head -20

      - name: Generate Build Commands List
        run: |
          cd ./wrt/
          
          # 创建 Uboots.txt 文件，列出所有支持的设备
          UBOOT_DIR="${{matrix.WRT_MTK}}"
          
          # 清空文件
          > Uboots.txt
          
          # 收集所有支持的设备
          declare -A lines_map
          declare -a type_7981_list=()
          declare -a type_7986_list=()
          
          for config_file in $UBOOT_DIR/configs/mt798*defconfig; do
            if [[ -f "$config_file" ]]; then
              config_name=$(basename "$config_file")
              board_name=${config_name%.defconfig}  # 移除 .defconfig 后缀
              
              # 解析 SoC 类型
              if [[ $board_name =~ ^mt7981_ ]]; then
                soc="mt7981"
                type_7981_list+=("$(echo $board_name | cut -d'_' -f2- | tr '[:lower:]' '[:upper:]')")
              elif [[ $board_name =~ ^mt7986_ ]]; then
                soc="mt7986"
                type_7986_list+=("$(echo $board_name | cut -d'_' -f2- | tr '[:lower:]' '[:upper:]')")
              else
                continue
              fi
              
              # 判断是否是 multi_layout 配置
              if [[ $config_name == *"_multi_layout_defconfig" ]]; then
                lines_map["$board_name"]="SOC=$soc BOARD=$board_name MULTI_LAYOUT=1 VERSION=2024 ATF_DIR=${{matrix.WRT_ATF}} UBOOT_DIR=${{matrix.WRT_MTK}} ./build.sh"
              else
                lines_map["$board_name"]="SOC=$soc BOARD=$board_name VERSION=2024 ATF_DIR=${{matrix.WRT_ATF}} UBOOT_DIR=${{matrix.WRT_MTK}} ./build.sh"
              fi
            fi
          done
          
          # 输出到 Uboots.txt
          for key in "${!lines_map[@]}"; do
            echo "${lines_map[$key]}" >> Uboots.txt
          done
          
          # 输出 Uboots.txt 内容
          echo "Generated Uboots.txt:"
          cat Uboots.txt
          
          # 输出设备分类信息
          echo "WRT_TYPE_7981=$(printf '%s ' "${type_7981_list[@]}" | xargs -n1 | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')" >> $GITHUB_ENV
          echo "WRT_TYPE_7986=$(printf '%s ' "${type_7986_list[@]}" | xargs -n1 | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')" >> $GITHUB_ENV
          
          # 确保没有多余空格
          sed -i 's/[[:space:]]*$//' Uboots.txt

      - name: Execute Build Commands from Uboots.txt
        run: |
          cd ./wrt/
          
          # 读取 Uboots.txt 并执行每行命令
          total_lines=$(wc -l < Uboots.txt)
          current_line=0
          
          while IFS= read -r line; do
            current_line=$((current_line + 1))
            if [[ -n "$line" ]]; then
              echo "=================================================="
              echo "Executing ($current_line/$total_lines): $line"
              echo "=================================================="
              
              # 执行命令
              eval "$line"
              
              # 检查编译状态
              if [ $? -ne 0 ]; then
                echo "Build failed for command: $line, continuing with next..."
              else
                echo "Build succeeded for command: $line"
              fi
            fi
          done < Uboots.txt

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Uboot
        run: |
          cd ./wrt/ && mkdir ./upload/

          for FILE in $(find ./output/ -type f -iname "*.*") ; do
            EXT=$(basename $FILE | cut -d '.' -f 2-)
            NAME=$(basename $FILE | cut -d '.' -f 1)
            NEW_FILE="$NAME"."$EXT"
            mv -f $FILE ./upload/$NEW_FILE
          done

          zip -r ./upload/mt798X-Uboot_"$WRT_DATE".zip ./upload/*.*

      - name: Release Uboot
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_AUTHOR}}_${{env.WRT_VER}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            平台：${{env.WRT_TARGET}}
            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}

            ATF版本：${{matrix.WRT_ATF}}
            MTK版本：${{matrix.WRT_MTK}}

            7981设备：${{env.WRT_TYPE_7981}}
            7986设备：${{env.WRT_TYPE_7986}}
