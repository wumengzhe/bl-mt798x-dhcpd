name: 798x-UBOOT-WMZ

on:
  #自动编译：每周日早上4点
  #schedule:
    #- cron: 0 20 * * 0
  #手动编译
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_TARGET: MTK-798x
  WRT_REPO: https://github.com/wumengzhe/bl-mt798x-dhcpd.git
  WRT_BRANCH: master

permissions: write-all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0

  build:
    runs-on: ubuntu-latest
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        WRT_ATF: [atf-20260123]
        WRT_MTK: [uboot-mtk-20250711]

    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu libssl-dev qemu-user-static
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_AUTHOR=$(echo $WRT_REPO | cut -d '/' -f 4)" >> $GITHUB_ENV
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d")" >> $GITHUB_ENV
          echo "WRT_VER=$(echo ${{matrix.WRT_ATF}} | grep -oP 'atf-\d+')_$(echo ${{matrix.WRT_MTK}} | grep -oP 'mtk-\d+')" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

      - name: Update Build Script
        run: |
          # 修改 build.sh 中的 UBOOT_DIR 和 ATF_DIR
          sed -i "s/UBOOT_DIR=.*/UBOOT_DIR=${{matrix.WRT_MTK}}/" ./wrt/build.sh
          sed -i "s/ATF_DIR=.*/ATF_DIR=${{matrix.WRT_ATF}}/" ./wrt/build.sh
          
          # 验证修改
          echo "Updated build.sh:"
          grep -E "(UBOOT_DIR|ATF_DIR)" ./wrt/build.sh

      - name: Generate Build Commands List (Fixed)
        run: |
          cd ./wrt/
          
          # 创建 Uboots.txt 文件
          > Uboots.txt
          
          # 收集所有支持的设备
          declare -A lines_map
          declare -a type_7981_list=()
          declare -a type_7986_list=()
          
          # 获取所有配置文件
          config_files=($(ls ${{matrix.WRT_MTK}}/configs/mt798*defconfig 2>/dev/null))
          
          for config_file in "${config_files[@]}"; do
            if [[ -f "$config_file" ]]; then
              config_name=$(basename "$config_file")
              
              # 解析配置文件名：mt7981_<device>_defconfig 或 mt7981_<device>_multi_layout_defconfig
              # 使用更简单的解析方法：去掉前缀 mt7981_ 和后缀 _defconfig/_multi_layout_defconfig
              device_name="${config_name#mt7981_}"  # 移除 mt7981_
              device_name="${device_name%_defconfig}"  # 移除 _defconfig
              device_name="${device_name%_multi_layout}"  # 移除 _multi_layout
              
              # 如果设备名中还有 _defconfig（比如 multi_layout 的情况）
              if [[ "$device_name" == *_defconfig ]]; then
                device_name="${device_name%_defconfig}"
              fi
              
              # 确保设备名不为空
              if [[ -z "$device_name" ]]; then
                continue
              fi
              
              # 确定 SoC 类型
              soc="mt7981"
              if [[ "$config_name" =~ ^mt7986_ ]]; then
                soc="mt7986"
              fi
              
              # 记录设备类型
              if [[ "$soc" == "mt7981" ]]; then
                type_7981_list+=("$(echo $device_name | tr '[:lower:]' '[:upper:]')")
              elif [[ "$soc" == "mt7986" ]]; then
                type_7986_list+=("$(echo $device_name | tr '[:lower:]' '[:upper:]')")
              fi
              
              # 判断是否是 multi_layout 配置
              is_multi_layout=0
              if [[ "$config_name" == *_multi_layout_defconfig ]]; then
                is_multi_layout=1
              fi
              
              # 构建命令
              base_cmd="SOC=$soc BOARD=$device_name VERSION=2024 ATF_DIR=${{matrix.WRT_ATF}} UBOOT_DIR=${{matrix.WRT_MTK}} ./build.sh"
              
              if [[ "$is_multi_layout" -eq 1 ]]; then
                # 对于 multi_layout 配置，需要设置 MULTI_LAYOUT=1
                cmd="$base_cmd MULTI_LAYOUT=1"
              else
                # 标准配置
                cmd="$base_cmd"
              fi
              
              # 存储命令（使用唯一键）
              key="${soc}_${device_name}"
              if [[ "$is_multi_layout" -eq 1 ]]; then
                key="${key}_multi_layout"
              fi
              
              lines_map["$key"]="$cmd"
            fi
          done
          
          # 输出到 Uboots.txt
          for key in "${!lines_map[@]}"; do
            echo "${lines_map[$key]}" >> Uboots.txt
          done
          
          # 输出内容
          echo "Generated Uboots.txt:"
          cat Uboots.txt
          
          # 输出设备分类信息
          echo "WRT_TYPE_7981=$(printf '%s ' "${type_7981_list[@]}" | xargs -n1 | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')" >> $GITHUB_ENV
          echo "WRT_TYPE_7986=$(printf '%s ' "${type_7986_list[@]}" | xargs -n1 | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')" >> $GITHUB_ENV
          
          # 清理空格
          sed -i 's/[[:space:]]*$//' Uboots.txt

      - name: Execute Build Commands from Uboots.txt
        run: |
          cd ./wrt/
          
          # 读取 Uboots.txt 并执行每行命令
          total_lines=$(wc -l < Uboots.txt)
          current_line=0
          
          while IFS= read -r line; do
            current_line=$((current_line + 1))
            if [[ -n "$line" ]]; then
              echo "=================================================="
              echo "Executing ($current_line/$total_lines): $line"
              echo "=================================================="
              
              # 执行命令
              eval "$line"
              
              # 检查编译状态
              if [ $? -ne 0 ]; then
                echo "Build failed for command: $line, continuing with next..."
              else
                echo "Build succeeded for command: $line"
              fi
            fi
          done < Uboots.txt

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Uboot
        run: |
          cd ./wrt/ && mkdir ./upload/

          for FILE in $(find ./output/ -type f -iname "*.*") ; do
            EXT=$(basename $FILE | cut -d '.' -f 2-)
            NAME=$(basename $FILE | cut -d '.' -f 1)
            NEW_FILE="$NAME"."$EXT"
            mv -f $FILE ./upload/$NEW_FILE
          done

          zip -r ./upload/mt798X-Uboot_"$WRT_DATE".zip ./upload/*.*

      - name: Release Uboot
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_AUTHOR}}_${{env.WRT_VER}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            平台：${{env.WRT_TARGET}}
            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}

            ATF版本：${{matrix.WRT_ATF}}
            MTK版本：${{matrix.WRT_MTK}}

            7981设备：${{env.WRT_TYPE_7981}}
            7986设备：${{env.WRT_TYPE_7986}}
